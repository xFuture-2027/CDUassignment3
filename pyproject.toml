[project]
name = "hit137-assignment3"
version = "1.0.0"
description = "HIT137 Assignment 3 - Image Processing Desktop Application"
authors = [
    {name = "Suraj Karki", email = "s397088@students.cdu.edu.au"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.19.0",
    "pillow>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = []